services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - db_data:/app/data       # Persist SQLite db across restarts (same path as EFS on AWS)
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/inventory.db
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "7860:7860"
    env_file:
      - .env
    environment:
      - BACKEND_URL=http://backend:8000   # Overrides .env — uses Docker network name
      - PORT=7860
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
