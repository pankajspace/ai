services:
  app:
    build: .
    container_name: exceptiondesk-app
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./app.py:/app/app.py
      - ./main.py:/app/main.py
      - ./triage_check.py:/app/triage_check.py
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app/src:/app

