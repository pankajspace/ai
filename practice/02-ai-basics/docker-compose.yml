# ---------------------------------------------------------------------------
# AI Basics Practice Suite - Docker Compose Configuration
# ---------------------------------------------------------------------------
# Run any single exercise from this folder (`practice/02-ai-basics/`):
#   docker compose run --rm --build 01_chat_openai
#   docker compose run --rm --build 10_rag
#
# Each service mounts `./<example>/main.py` into `/app/main.py` so edits to
# `main.py` take effect immediately on the next `docker compose run --rm <service>`
# without rebuilding the image.
# ---------------------------------------------------------------------------

services:
  # ① Direct OpenAI Chat Completions API (Travel Guide)
  01_chat_openai:
    build: ./01_chat_openai
    env_file:
      - path: ./01_chat_openai/.env
        required: false
    volumes:
      - ./01_chat_openai/main.py:/app/main.py

  # ② Groq Chat Completions via OpenAI-compatible client (Joke Generator)
  02_chat_groq:
    build: ./02_chat_groq
    env_file:
      - path: ./02_chat_groq/.env
        required: false
    volumes:
      - ./02_chat_groq/main.py:/app/main.py

  # ③ LangChain LCEL Pipe Chain: prompt | model | parser (Text Summarizer)
  03_langchain_summarizer:
    build: ./03_langchain_summarizer
    env_file:
      - path: ./03_langchain_summarizer/.env
        required: false
    volumes:
      - ./03_langchain_summarizer/main.py:/app/main.py

  # ④ Multi-turn Conversational Memory with MessagesPlaceholder
  04_langchain_memory_chat:
    build: ./04_langchain_memory_chat
    env_file:
      - path: ./04_langchain_memory_chat/.env
        required: false
    volumes:
      - ./04_langchain_memory_chat/main.py:/app/main.py

  # ⑤ Minimal Single-Tool Agent Loop using Raw OpenAI Function Calling
  05_agent_one_tool:
    build: ./05_agent_one_tool
    env_file:
      - path: ./05_agent_one_tool/.env
        required: false
    volumes:
      - ./05_agent_one_tool/main.py:/app/main.py

  # ⑥ LangChain Single-Tool Agent (`create_agent`)
  06_langchain_one_tool:
    build: ./06_langchain_one_tool
    env_file:
      - path: ./06_langchain_one_tool/.env
        required: false
    volumes:
      - ./06_langchain_one_tool/main.py:/app/main.py

  # ⑦ LangChain Multi-Tool Agent with Visible Tool Execution Trace
  07_langchain_multi_tools:
    build: ./07_langchain_multi_tools
    env_file:
      - path: ./07_langchain_multi_tools/.env
        required: false
    volumes:
      - ./07_langchain_multi_tools/main.py:/app/main.py

  # ⑧ Document Chunking with RecursiveCharacterTextSplitter (No API Key Needed)
  08_chunking:
    build: ./08_chunking
    env_file:
      - path: ./08_chunking/.env
        required: false
    volumes:
      - ./08_chunking/main.py:/app/main.py

  # ⑨ Local Sentence Embeddings & Cosine Similarity (No API Key Needed)
  09_embedding:
    build: ./09_embedding
    env_file:
      - path: ./09_embedding/.env
        required: false
    volumes:
      - ./09_embedding/main.py:/app/main.py

  # ⑩ Complete Paragraph RAG Pipeline (Chunk -> Chroma Vector Store -> LLM Answer)
  10_rag:
    build: ./10_rag
    env_file:
      - path: ./10_rag/.env
        required: false
    volumes:
      - ./10_rag/main.py:/app/main.py


