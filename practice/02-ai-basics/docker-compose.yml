# ---------------------------------------------------------------------------
# AI Basics Practice Suite - Docker Compose Configuration
# ---------------------------------------------------------------------------
# Run any single exercise from this folder (`practice/02-ai-basics/`):
#   docker compose run --rm 01_chat_openai
#   docker compose run --rm 07_langchain_multi_tools
#
# All services share a single Docker image built from the common `Dockerfile`
# and `requirements.txt`, load `./.env`, and mount their `.py` script into
# `/app/` so code edits take effect immediately without rebuilding.
# ---------------------------------------------------------------------------

services:
  # ① Direct OpenAI Chat Completions API (Travel Guide)
  01_chat_openai:
    build: .
    image: practice-02-ai-basics
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./01_chat_openai.py:/app/01_chat_openai.py
    entrypoint: ["python", "01_chat_openai.py"]

  # ② Groq Chat Completions via OpenAI-compatible client (Joke Generator)
  02_chat_groq:
    build: .
    image: practice-02-ai-basics
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./02_chat_groq.py:/app/02_chat_groq.py
    entrypoint: ["python", "02_chat_groq.py"]

  # ③ LangChain LCEL Pipe Chain: prompt | model | parser (Text Summarizer)
  03_langchain_summarizer:
    build: .
    image: practice-02-ai-basics
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./03_langchain_summarizer.py:/app/03_langchain_summarizer.py
    entrypoint: ["python", "03_langchain_summarizer.py"]

  # ④ Multi-turn Conversational Memory with MessagesPlaceholder
  04_langchain_memory_chat:
    build: .
    image: practice-02-ai-basics
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./04_langchain_memory_chat.py:/app/04_langchain_memory_chat.py
    entrypoint: ["python", "04_langchain_memory_chat.py"]

  # ⑤ Minimal Single-Tool Agent Loop using Raw OpenAI Function Calling
  05_agent_one_tool:
    build: .
    image: practice-02-ai-basics
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./05_agent_one_tool.py:/app/05_agent_one_tool.py
    entrypoint: ["python", "05_agent_one_tool.py"]

  # ⑥ LangChain Single-Tool Agent (`create_agent`)
  06_langchain_one_tool:
    build: .
    image: practice-02-ai-basics
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./06_langchain_one_tool.py:/app/06_langchain_one_tool.py
    entrypoint: ["python", "06_langchain_one_tool.py"]

  # ⑦ LangChain Multi-Tool Agent with Visible Tool Execution Trace
  07_langchain_multi_tools:
    build: .
    image: practice-02-ai-basics
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./07_langchain_multi_tools.py:/app/07_langchain_multi_tools.py
    entrypoint: ["python", "07_langchain_multi_tools.py"]
