# ---------------------------------------------------------------------------
# Docker Compose — 06-ai-mcp-evals Practice Suite
# ---------------------------------------------------------------------------
# Usage (from practice/06-ai-mcp-evals/):
#   docker compose run --rm 01_mcp_client
#   docker compose run --rm 02_mcp_agent
#   docker compose run --rm 03_mcp_evals
# ---------------------------------------------------------------------------

services:
  # ① Step 1: Direct FastMCP Client (no LLM required; tests stdio handshake & tool call)
  01_mcp_client:
    build: ./01_mcp_client
    env_file:
      - path: ./01_mcp_client/.env
        required: false
    volumes:
      - ./01_mcp_client/main.py:/app/main.py
      - ./01_mcp_client/cricket_server.py:/app/cricket_server.py

  # ② Step 2: MCP-Enabled LLM Agent (Groq LLM + FastMCP cricket tools)
  02_mcp_agent:
    build: ./02_mcp_agent
    env_file:
      - path: ./02_mcp_agent/.env
        required: false
    volumes:
      - ./02_mcp_agent/main.py:/app/main.py
      - ./02_mcp_agent/cricket_server.py:/app/cricket_server.py

  # ③ Step 3: MCP Agent Evaluation Suite (Tool routing & ground-truth assertions)
  03_mcp_evals:
    build: ./03_mcp_evals
    env_file:
      - path: ./03_mcp_evals/.env
        required: false
    volumes:
      - ./03_mcp_evals/main.py:/app/main.py
      - ./03_mcp_evals/cricket_server.py:/app/cricket_server.py


