services:
  01_mcp_client:
    build: ./01_mcp_client
    env_file:
      - path: ./01_mcp_client/.env
        required: false
    volumes:
      - ./01_mcp_client/main.py:/app/main.py
      - ./01_mcp_client/cricket_server.py:/app/cricket_server.py

  02_mcp_agent:
    build: ./02_mcp_agent
    env_file:
      - path: ./02_mcp_agent/.env
        required: false
    volumes:
      - ./02_mcp_agent/main.py:/app/main.py
      - ./02_mcp_agent/cricket_server.py:/app/cricket_server.py

  03_mcp_evals:
    build: ./03_mcp_evals
    env_file:
      - path: ./03_mcp_evals/.env
        required: false
    volumes:
      - ./03_mcp_evals/main.py:/app/main.py
      - ./03_mcp_evals/cricket_server.py:/app/cricket_server.py

