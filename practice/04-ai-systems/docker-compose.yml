# ---------------------------------------------------------------------------
# Docker Compose — AI Systems Practice Suite (04-ai-systems)
# ---------------------------------------------------------------------------
# Usage (from practice/04-ai-systems/):
#   docker compose run --rm 01_prompting_strategies
#   docker compose run --rm 02_sycophancy_trap
#   docker compose run --rm 03_refund_bench
# ---------------------------------------------------------------------------

services:
  # ① Prompting Strategies Benchmark: Direct vs. Zero-Shot CoT vs. Few-Shot CoT
  01_prompting_strategies:
    build: ./01_prompting_strategies
    env_file:
      - path: ./01_prompting_strategies/.env
        required: false
    volumes:
      - ./01_prompting_strategies/main.py:/app/main.py

  # ② The Sycophancy Trap: Multi-turn resilience under escalating user pushbacks
  02_sycophancy_trap:
    build: ./02_sycophancy_trap
    env_file:
      - path: ./02_sycophancy_trap/.env
        required: false
    volumes:
      - ./02_sycophancy_trap/main.py:/app/main.py

  # ③ The Refund Bench: 4-stage multi-judge dispute adjudication pipeline
  03_refund_bench:
    build: ./03_refund_bench
    env_file:
      - path: ./03_refund_bench/.env
        required: false
    volumes:
      - ./03_refund_bench/main.py:/app/main.py


