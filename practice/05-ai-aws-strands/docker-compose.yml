# ---------------------------------------------------------------------------
# AWS Strands Agents Practice Suite — Docker Compose Configuration
#
# Run any individual lesson container from this directory:
#   docker compose run --rm <service_name>
# Example:
#   docker compose run --rm 01_hello_world_agent
#
# All services share a single Docker image built from the common `Dockerfile`
# and `requirements.txt`, load `./.env`, and mount their `.py` script into
# `/app/` so code edits take effect immediately without rebuilding.
# ---------------------------------------------------------------------------

services:
  # ① Lesson 1.1: Minimal autonomous agent with Strands + Amazon Bedrock Nova Lite
  01_hello_world_agent:
    build: .
    image: practice-05-ai-aws-strands
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./01_hello_world_agent.py:/app/01_hello_world_agent.py
    entrypoint: ["python", "01_hello_world_agent.py"]

  # ② Lesson 1.2: ReAct tool-calling agent loop implemented with LangGraph + Bedrock Converse
