# ---------------------------------------------------------------------------
# Docker Compose — AI Reliability Practice Suite (05-ai-reliability)
# ---------------------------------------------------------------------------
# Usage (from practice/05-ai-reliability/):
#   docker compose run --rm 01_cot_vs_direct
#   docker compose run --rm 02_variance_determinism
#   docker compose run --rm 03_tool_schema_calibration
#   docker compose run --rm 04_tool_error_injection
# ---------------------------------------------------------------------------

services:
  # ① Chain-of-Thought vs. Direct Answer: Measuring CoT as a reliability lever
  01_cot_vs_direct:
    build: ./01_cot_vs_direct
    env_file:
      - path: ./01_cot_vs_direct/.env
        required: false
    volumes:
      - ./01_cot_vs_direct/main.py:/app/main.py

  # ② Variance & Determinism: Unconstrained vs. Prompt-Constrained vs. Schema-Enforced JSON
  02_variance_determinism:
    build: ./02_variance_determinism
    env_file:
      - path: ./02_variance_determinism/.env
        required: false
    volumes:
      - ./02_variance_determinism/main.py:/app/main.py

  # ③ Tool Schema Calibration: 2x2 routing benchmark (Descriptive/Opaque x Loose/Tight)
  03_tool_schema_calibration:
    build: ./03_tool_schema_calibration
    env_file:
      - path: ./03_tool_schema_calibration/.env
        required: false
    volumes:
      - ./03_tool_schema_calibration/main.py:/app/main.py

  # ④ Tool Error Injection: HTTP 503 failure handling and hallucination prevention
  04_tool_error_injection:
    build: ./04_tool_error_injection
    env_file:
      - path: ./04_tool_error_injection/.env
        required: false
    volumes:
      - ./04_tool_error_injection/main.py:/app/main.py

