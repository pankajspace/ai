[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-learning"
version = "1.0.0"
description = "Small demos of LLM-powered prompt calls using OpenAI and Groq."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1",
]

[tool.setuptools]
package-dir = {"" = "src"}

py-modules = ["config", "joke", "travel"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
