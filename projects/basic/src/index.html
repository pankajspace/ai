<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Playground</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            background: linear-gradient(90deg, #818cf8, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 2.5rem;
            font-size: 0.95rem;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 760px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 1rem;
            padding: 1.75rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .card h2 {
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .card p.description {
            color: #94a3b8;
            font-size: 0.875rem;
            line-height: 1.5;
        }

        input[type="text"] {
            width: 100%;
            padding: 0.55rem 0.9rem;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            color: #e2e8f0;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #818cf8;
        }

        button {
            padding: 0.6rem 1.2rem;
            border: none;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s, transform 0.1s;
        }

        button:active {
            transform: scale(0.97);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-joke {
            background: #818cf8;
            color: #fff;
        }

        .btn-travel {
            background: #38bdf8;
            color: #0f172a;
        }

        .result {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 0.9rem;
            font-size: 0.9rem;
            line-height: 1.6;
            color: #cbd5e1;
            min-height: 3.5rem;
            white-space: pre-wrap;
            display: none;
        }

        .result.visible {
            display: block;
        }

        .error {
            color: #f87171;
        }

        .spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid currentColor;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 0.4rem;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <h1>AI Playground</h1>
    <p class="subtitle">Powered by Groq &amp; OpenAI</p>

    <div class="cards">

        <!-- Joke Card -->
        <div class="card">
            <h2>&#x1F602; Joke Generator</h2>
            <p class="description">Get a fresh joke from Llama 3.3 70B via Groq.</p>
            <button class="btn-joke" id="jokeBtn" onclick="fetchJoke()">Tell me a joke</button>
            <div class="result" id="jokeResult"></div>
        </div>

        <!-- Travel Card -->
        <div class="card">
            <h2>&#x2708;&#xFE0F; Travel Suggestion</h2>
            <p class="description">Ask GPT-4o mini what to do in any city.</p>
            <input type="text" id="cityInput" placeholder="Enter a city (e.g. Tokyo)" />
            <button class="btn-travel" id="travelBtn" onclick="fetchTravel()">Suggest something</button>
            <div class="result" id="travelResult"></div>
        </div>

    </div>

    <script>
        const API = "";

        function setLoading(btn, result, loading) {
            btn.disabled = loading;
            btn.innerHTML = loading
                ? `<span class="spinner"></span> Loading…`
                : btn.dataset.label;
        }

        async function fetchJoke() {
            const btn = document.getElementById("jokeBtn");
            const result = document.getElementById("jokeResult");
            if (!btn.dataset.label) btn.dataset.label = btn.textContent;
            setLoading(btn, result, true);
            result.className = "result visible";
            result.textContent = "";
            try {
                const res = await fetch(`${API}/joke`);
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                result.textContent = data.result;
            } catch (e) {
                result.innerHTML = `<span class="error">Error: ${e.message}</span>`;
            } finally {
                setLoading(btn, result, false);
            }
        }

        async function fetchTravel() {
            const btn = document.getElementById("travelBtn");
            const result = document.getElementById("travelResult");
            const city = document.getElementById("cityInput").value.trim() || "Bangalore";
            if (!btn.dataset.label) btn.dataset.label = btn.textContent;
            setLoading(btn, result, true);
            result.className = "result visible";
            result.textContent = "";
            try {
                const res = await fetch(`${API}/travel`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ city }),
                });
                const data = await res.json();
                if (data.error) throw new Error(data.error);
                result.textContent = data.result;
            } catch (e) {
                result.innerHTML = `<span class="error">Error: ${e.message}</span>`;
            } finally {
                setLoading(btn, result, false);
            }
        }
    </script>
</body>

</html>
