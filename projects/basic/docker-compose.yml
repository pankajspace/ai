services:
  web:
    build: .
    env_file: .env
    command: python src/python/app.py
    ports:
      - "8080:5000"
    volumes:
      - ./src:/app/src

  joke:
    build: .
    env_file: .env
    command: python src/python/joke.py

  travel:
    build: .
    env_file: .env
    command: python src/python/travel.py

  summarize:
    build: .
    env_file: .env
    command: python src/python/summarizer.py

  arena:
    build: .
    env_file: .env
    command: python src/python/arena.py
