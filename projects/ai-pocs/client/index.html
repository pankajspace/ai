<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI POCs</title>
    <meta name="description" content="AI POCs — FastAPI + React Multi-Container POC" />
    <style>
      html,
      body {
        background-color: #121212;
        color: #e0e0e0;
        margin: 0;
        font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .app-boot-loader {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 0.9rem;
      }
      .app-boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #2a2a2a;
        border-top-color: #90caf9;
        border-radius: 50%;
        animation: app-boot-spin 0.75s linear infinite;
      }
      .app-boot-title {
        font-size: 0.95rem;
        font-weight: 600;
        color: #e0e0e0;
        letter-spacing: 0.01em;
      }
      .app-boot-subtitle {
        font-size: 0.78rem;
        color: #9e9e9e;
      }
      @keyframes app-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-boot-loader" role="status" aria-live="polite">
        <div class="app-boot-spinner" aria-hidden="true"></div>
        <div class="app-boot-title">Loading AI POCs&hellip;</div>
        <div class="app-boot-subtitle">Initializing 31 AI services</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
