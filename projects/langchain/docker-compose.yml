services:
  web:
    build: .
    env_file: .env
    command: python src/python/app.py
    ports:
      - "8081:5000"
    volumes:
      - ./src:/app/src

  summarize:
    build: .
    env_file: .env
    command: python src/python/summarizer.py

  chat:
    build: .
    env_file: .env
    command: python src/python/chat.py

  agent:
    build: .
    env_file: .env
    command: python src/python/agent.py
