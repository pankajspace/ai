<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechToday — Projects Temporarily Unavailable</title>
    <style>
        :root {
            --bg: #121212;
            --bg-elevated: #1e1e1e;
            --border: #2c2c2c;
            --text: #e2e8f0;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --amber: #f59e0b;
            --amber-bright: #fbbf24;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            line-height: 1.6;
        }

        header {
            border-bottom: 1px solid var(--border);
            background: rgba(18, 18, 18, 0.92);
        }

        .nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 0.85rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--text);
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .nav-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.95rem;
        }

        .nav-link:hover {
            color: var(--accent);
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1.5rem;
        }

        .card {
            max-width: 540px;
            width: 100%;
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 2.25rem 2rem;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            padding: 0.3rem 0.75rem;
            border-radius: 999px;
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.35);
            color: var(--amber-bright);
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            margin-bottom: 1.25rem;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--amber);
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: #f8fafc;
            margin-bottom: 0.75rem;
            line-height: 1.25;
        }

        p {
            color: var(--text-muted);
            font-size: 1rem;
            margin-bottom: 1.75rem;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0.65rem 1.2rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
        }

        .btn-primary {
            background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4);
            color: #7dd3fc;
        }

        .btn-primary:hover {
            background: rgba(56, 189, 248, 0.24);
            border-color: rgba(56, 189, 248, 0.65);
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-muted);
        }

        .btn-secondary:hover {
            border-color: #475569;
            color: var(--text);
        }

        footer {
            padding: 1.25rem 1.5rem;
            text-align: center;
            color: #64748b;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>
    <header>
        <nav class="nav">
            <a href="https://techtoday.click/" class="brand">
                <svg viewBox="0 0 24 24" width="22" height="22" fill="none" aria-hidden="true">
                    <circle cx="12" cy="12" r="9.5" stroke="#38bdf8" stroke-width="1.6" fill="rgba(56, 189, 248, 0.14)" />
                    <circle cx="12" cy="12" r="3" fill="#ffffff" />
                </svg>
                <span>TechToday</span>
            </a>
            <a href="https://techtoday.click/study/ai-projects/ai-projects.html" class="nav-link">&larr; AI Demos</a>
        </nav>
    </header>

    <main>
        <section class="card" role="status" aria-live="polite">
            <div class="status-pill">
                <span class="status-dot" aria-hidden="true"></span>
                <span>503 · Temporarily Paused</span>
            </div>
            <h1>AI Demo Projects Are Temporarily Unavailable</h1>
            <p>
                Interactive demo projects on TechToday are currently paused. Study guides, courses, and reusable code
                snippets remain available on the main site.
            </p>
            <div class="actions">
                <a class="btn btn-primary" href="https://techtoday.click/study/ai-projects/ai-projects.html">Back to AI
                    Demos</a>
                <a class="btn btn-secondary" href="https://techtoday.click/">Go to Home</a>
            </div>
        </section>
    </main>

    <footer>&copy; 2026 TechToday</footer>
</body>

</html>
