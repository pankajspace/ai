services:
  web:
    build: .
    env_file: .env
    command: python src/python/app.py
    ports:
      # TODO: change 8090 to your project's local port (basic=8080,
      # langchain=8081, next free port=8082, ...). The container always
      # listens on 5000 internally.
      - "8090:5000"
    volumes:
      - ./src:/app/src

  # One-off CLI service to run the starter feature directly, without the web
  # UI. Add a similar block per feature module you create under src/python/.
  echo:
    build: .
    env_file: .env
    command: python src/python/echo.py
