<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Template</title>
    <meta name="description"
        content="Starter template for a Flask + Docker project behind the shared Nginx path-prefix routing." />
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧩</text></svg>" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body data-api-base="">
    <header>
        <nav class="nav container">
            <a href="https://techtoday.click" class="brand">
                <span class="logo">⚡</span>
                <span>TechToday</span>
            </a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <!-- TODO: rename this project throughout (title, hero, cards). -->
                <h1>Project Template</h1>
                <p class="subtitle">A Flask + Docker starter wired for path-prefix routing</p>
            </div>
        </section>

        <section id="tools">
            <div class="container">
                <div class="grid">

                    <!-- Starter feature card — replace with your own features. -->
                    <div class="card card-wide">
                        <h2>&#x1F9E9; Echo</h2>
                        <p>The starter feature. Type a message and the server echoes it back via
                            <code>POST /echo</code> — no API keys required.
                        </p>
                        <input type="text" id="echoInput" placeholder="Type a message…" />
                        <span class="validation" id="echoValidation"></span>
                        <button id="echoBtn" disabled>Send</button>
                        <div class="result" id="echoResult"></div>
                    </div>

                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 TechToday.</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>

</html>
