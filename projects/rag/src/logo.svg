<svg viewBox="0 0 24 24" width="24" height="24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="ttCircleStroke" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" />
            <stop offset="50%" stop-color="#0ea5e9" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="ttCircleFill" x1="2" y1="2" x2="22" y2="22" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
            <stop offset="100%" stop-color="#6366f1" stop-opacity="0.08" />
        </linearGradient>
        <filter id="ttCircleGlow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#38bdf8" flood-opacity="0.5" />
        </filter>
    </defs>
    <g filter="url(#ttCircleGlow)">
        <!-- Outer circle -->
        <circle cx="12" cy="12" r="9.75" fill="url(#ttCircleFill)" stroke="url(#ttCircleStroke)" stroke-width="1.3" />
        <!-- Inner circle -->
        <circle cx="12" cy="12" r="3.2" fill="#ffffff" />
    </g>
</svg>
