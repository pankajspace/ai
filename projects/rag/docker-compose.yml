services:
  web:
    build: .
    env_file: .env
    command: python src/python/app.py
    ports:
      - "8082:5000"
    volumes:
      - ./src:/app/src

  # One-off CLI services to run individual features directly, without the
  # web UI. Each maps to a module under src/python/.
  embeddings:
    build: .
    env_file: .env
    command: python src/python/embeddings.py

  chunk:
    build: .
    env_file: .env
    command: python src/python/chunk.py

  index:
    build: .
    env_file: .env
    command: python src/python/index.py

  rag:
    build: .
    env_file: .env
    command: python src/python/rag.py

  rerank:
    build: .
    env_file: .env
    command: python src/python/rerank.py

  pdf-chat:
    build: .
    env_file: .env
    command: python src/python/pdf_chat.py
