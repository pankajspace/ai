services:
  web:
    build: .
    env_file: .env
    command: python src/app.py
    ports:
      - "8082:5000"
    volumes:
      - ./src:/app/src

  # One-off CLI services to run individual features directly, without the
  # web UI. Each maps to a module under src/.
  embeddings:
    build: .
    env_file: .env
    command: python src/embeddings.py

  chunk:
    build: .
    env_file: .env
    command: python src/chunk.py

  index:
    build: .
    env_file: .env
    command: python src/index.py

  rag:
    build: .
    env_file: .env
    command: python src/rag.py

  rerank:
    build: .
    env_file: .env
    command: python src/rerank.py

  pdf-chat:
    build: .
    env_file: .env
    command: python src/pdf_chat.py
