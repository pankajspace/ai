services:
  # ── Main Demo Web App ──────────────────────────────────────────────
  web:
    build: .
    env_file: .env
    command: python src/python/app.py
    ports:
      - "8083:5000"
    volumes:
      - ./src:/app/src
    depends_on:
      quickbite:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Level 1: QuickBite ETA (1 container, keyless) ──────────────────
  quickbite:
    build: ./src/quick-bite-eta
    container_name: docker-quickbite
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  # ── Level 2: ScalerGPT (2 containers, needs OPENAI_API_KEY) ───────
  scalergpt:
    build: ./src/scaler-gpt
    container_name: docker-scalergpt
    env_file: .env
    environment:
      - CHROMA_HOST=scalergpt-chroma
      - CHROMA_PORT=8000
    depends_on:
      scalergpt-chroma:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  scalergpt-chroma:
    image: chromadb/chroma:0.6.3
    container_name: docker-scalergpt-chroma
    volumes:
      - scalergpt_chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v2/heartbeat')" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  # ── Level 3: DeskBuddy (3 containers, needs OPENAI_API_KEY) ───────
  deskbuddy-agent:
    build: ./src/desk-buddy/agent
    container_name: docker-deskbuddy-agent
    env_file: .env
    environment:
      - TOOLS_URL=http://deskbuddy-tools:7000
      - REDIS_HOST=deskbuddy-redis
    depends_on:
      deskbuddy-tools:
        condition: service_healthy
      deskbuddy-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9000/')" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s

  deskbuddy-tools:
    build: ./src/desk-buddy/tools
    container_name: docker-deskbuddy-tools
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7000/')" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  deskbuddy-redis:
    image: redis:7-alpine
    container_name: docker-deskbuddy-redis
    volumes:
      - deskbuddy_memory:/data
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

volumes:
  scalergpt_chroma_data:
  deskbuddy_memory:
