# Builds and deploys the "techtoday" static home page to production.
#
# Trigger: any push to `main` that changes a file under `projects/techtoday/`.
#
# What happens, step by step:
#   1. Check out the repo so the site files are available.
#   2. Assume a scoped AWS IAM role via OIDC — no long-lived AWS access keys
#      are stored in GitHub Secrets.
#   3. Merge src/ (home page) and study/ into one tree, then rsync it to
#      /var/www/techtoday/ on the production EC2 instance via SSH. Nginx
#      serves these files directly — no Docker container, no image build,
#      no registry.
#   4. Write a deploy summary to the Actions job summary.
#
# See projects/SETUP.md for the one-time Nginx and DNS setup, and
# projects/techtoday/README.md for the everyday commit and deploy workflow.
name: Deploy techtoday

on:
  push:
    branches: [main]
    paths:
      - 'projects/techtoday/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          source-account-id: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh

          # Handle both true multiline secrets and single-line secrets with
          # escaped \n, and normalize CRLF line endings.
          KEY_CONTENT='${{ secrets.EC2_SSH_KEY }}'
          if printf '%s' "$KEY_CONTENT" | grep -q '\\n'; then
            printf '%b' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/deploy_key
          fi

          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Assemble home page and study guides
        run: |
          chmod +x projects/techtoday/scripts/assemble_site.sh
          projects/techtoday/scripts/assemble_site.sh "$PWD/site"

      - name: Deploy static files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            site/ \
            ec2-user@${{ secrets.EC2_HOST }}:/var/www/techtoday/

      - name: Record deploy in job summary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "### Deployed techtoday home page" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`/var/www/techtoday/\` on \`${{ secrets.EC2_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live at: https://techtoday.click/" >> "$GITHUB_STEP_SUMMARY"
