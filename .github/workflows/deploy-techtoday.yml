# Builds and deploys the "techtoday" static home page to production.
#
# Trigger: any push to `main` that changes a file under `projects/techtoday/`.
#
# What happens, step by step:
#   1. Check out the repo so the site files are available.
#   2. Assume a scoped AWS IAM role via OIDC — no long-lived AWS access keys
#      are stored in GitHub Secrets.
#   3. Copy public files (index.html, CSS, study/) into one tree, then rsync
#      it to /var/www/techtoday/ on the production EC2 instance via SSH. Nginx
#      serves these files directly — no Docker container, no image build,
#      no registry.
#   4. Write a deploy summary to the Actions job summary.
#
# See projects/SETUP.md for the one-time Nginx and DNS setup, and
# projects/techtoday/README.md for the everyday commit and deploy workflow.
name: Deploy techtoday

env:
  # Set to 'true' to block all direct access to app.techtoday.click/<project>/
  # with a styled 503 maintenance page. Set to 'false' and push to re-enable.
  DISABLE_PROJECTS: 'true'

on:
  push:
    # Every branch deploys on push, so any branch can be tested live. All
    # branches target the same EC2 host: the most recent deploy is what's live.
    branches: ['**']
    paths:
      - 'projects/techtoday/**'
      - '.github/workflows/deploy-techtoday.yml'
  workflow_dispatch:

# Run one deploy of this project at a time, so pushes from different branches
# queue up instead of racing on the shared EC2 host.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh

          # Handle both true multiline secrets and single-line secrets with
          # escaped \n, and normalize CRLF line endings.
          KEY_CONTENT='${{ secrets.EC2_SSH_KEY }}'
          if printf '%s' "$KEY_CONTENT" | grep -q '\\n'; then
            printf '%b' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/deploy_key
          else
            printf '%s' "$KEY_CONTENT" | tr -d '\r' > ~/.ssh/deploy_key
          fi

          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Assemble home page and study guides
        run: |
          mkdir -p "$PWD/site"
          rsync -av --delete \
            --exclude '.env*' \
            --exclude '.gitignore' \
            --exclude 'README.md' \
            projects/techtoday/ "$PWD/site/"

      - name: Deploy static files via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            site/ \
            ec2-user@${{ secrets.EC2_HOST }}:/var/www/techtoday/

      - name: Configure Nginx backward compatibility redirects
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} '
            sudo mkdir -p /etc/nginx/conf.d/app-locations
            sudo tee /etc/nginx/conf.d/app-locations/00-legacy-redirects.conf > /dev/null << "EOF"
            # Backward compatibility redirects for ai-pocs and ai-demos
            location ^~ /ai-pocs {
                return 301 https://app.techtoday.click/ai-projects/ai-projects.html;
            }

            location ^~ /ai-demos {
                return 301 https://app.techtoday.click/ai-projects/ai-projects.html;
            }

            location = /ai-projects/ai-projects.html {
                return 301 https://techtoday.click/study/ai-projects/ai-projects.html;
            }

            location ^~ /ai-projects {
                return 301 https://techtoday.click/study/ai-projects/ai-projects.html;
            }

            location ^~ /interviewiq {
                return 301 https://app.techtoday.click/09-interviewiq/;
            }

            location ^~ /shipment-exception-desk {
                return 301 https://app.techtoday.click/10-shipment-exception-desk/;
            }
            EOF
            sudo nginx -t && sudo systemctl reload nginx
          '

      - name: Configure Nginx project access (maintenance toggle)
        run: |
          if [ "${{ env.DISABLE_PROJECTS }}" = "true" ]; then
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
              'sudo mkdir -p /etc/nginx/conf.d/app-locations && sudo tee /etc/nginx/conf.d/app-locations/00-projects-maintenance.conf > /dev/null && sudo nginx -t && sudo systemctl reload nginx' <<'NGINX_EOF'
          # Temporarily disable direct access to all container projects under app.techtoday.click.
          # Managed by .github/workflows/deploy-techtoday.yml (DISABLE_PROJECTS).
          location = /projects-unavailable.html {
              root /var/www/techtoday;
              internal;
              error_page 405 =503 @projects_unavailable_json;
          }

          location @projects_unavailable_json {
              default_type application/json;
              add_header Retry-After 3600 always;
              return 503 '{"error": "AI Demo projects are temporarily unavailable."}\n';
          }

          # Regex location takes precedence over per-project prefix locations (e.g. /01-ai-basics/),
          # while preserving ^~ legacy redirects (/ai-projects, /ai-pocs, /ai-demos).
          location ~ ^/([0-9]{2}-[^/]+)(/|$) {
              add_header Retry-After 3600 always;
              error_page 503 /projects-unavailable.html;
              return 503;
          }
          NGINX_EOF
          else
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_HOST }} \
              'if [ -f /etc/nginx/conf.d/app-locations/00-projects-maintenance.conf ]; then sudo rm -f /etc/nginx/conf.d/app-locations/00-projects-maintenance.conf && sudo nginx -t && sudo systemctl reload nginx; fi'
          fi

      - name: Record deploy in job summary
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "### Deployed techtoday home page" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: \`$GITHUB_REF_NAME\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`$SHORT_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Target: \`/var/www/techtoday/\` on \`${{ secrets.EC2_HOST }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Live at: https://techtoday.click/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Projects disabled (\`DISABLE_PROJECTS\`): \`${{ env.DISABLE_PROJECTS }}\`" >> "$GITHUB_STEP_SUMMARY"
