# Builds and deploys the "basic" project (projects/basic) to production.
#
# Trigger: any push to `main` that changes a file under `projects/basic/`.
#
# What happens, step by step:
#   1. Check out the repo so the Dockerfile and source code are available.
#   2. Assume a scoped AWS IAM role via OIDC — no long-lived AWS access keys
#      are ever stored in GitHub Secrets.
#   3. Log the local Docker CLI in to our private ECR registry.
#   4. Compute a human-readable build tag for this run.
#   5. Build the image once and push it to ECR under three tags: the full
#      git SHA, the human-readable build tag, and `latest`.
#   6. Write the build tag to the run's job summary so it's easy to find
#      later if a rollback is ever needed.
#   7. SSH into the production EC2 host and tell Docker Compose to pull and
#      restart only the `basic` container — every other service already
#      running on that host (e.g. `langchain`) is left untouched.
#
# See projects/SETUP.md (§ 2.11 "Set Up GitHub OIDC and Deploy Role") for the
# one-time AWS/GitHub setup this workflow depends on (OIDC provider, IAM
# roles and GitHub secrets), and projects/basic/README.md for day-to-day usage,
# manual fallback deployment, and rollback instructions.
name: Deploy basic

on:
  push:
    branches: [main]
    # Only run when this project's own files change, so unrelated commits
    # (e.g. edits to a different project, or to root-level docs) don't
    # trigger an unnecessary redeploy of basic.
    paths:
      - 'projects/basic/**'

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: techtoday/basic
  # Full 40-character git commit SHA for this run. Pushed as one of the three
  # image tags below — useful for exact traceability, if less readable than
  # the build tag computed further down.
  IMAGE_TAG: ${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      # id-token: write lets this job request a short-lived OIDC token from
      # GitHub, which configure-aws-credentials then exchanges for temporary
      # AWS credentials. This avoids storing a static AWS access key/secret
      # as a GitHub Secret.
      id-token: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        # Enables BuildKit, which is required for the GitHub Actions layer
        # cache used by the build step below.
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials via OIDC
        # Assumes the IAM role named in the AWS_DEPLOY_ROLE_ARN secret. That
        # role is scoped to ECR push and read permissions on techtoday/* repos
        # (see SETUP.md § 2.11 "Set Up GitHub OIDC and Deploy Role") — the read
        # actions let BuildKit's manifest HEAD check succeed; this job cannot
        # touch any other AWS resource.
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          allowed-account-ids: ${{ secrets.AWS_ACCOUNT_ID }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        # Authenticates the runner's Docker CLI against our ECR registry
        # using the temporary credentials obtained in the previous step.
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute a human-readable build tag
        # Generates a sortable, human-friendly tag for this build, in the
        # form YYYYMMDD-HHMMSS-<run-number>-<short-sha>
        #   e.g. 20260701-153045-42-a1b2c3d
        # This is much easier to recognize than a raw 40-character SHA when
        # scanning the ECR console or CLI output, and it doubles as a small
        # audit trail: at a glance you can tell when the image was built,
        # which Actions run built it (the run number), and the exact commit
        # it was built from (the short SHA). This is the tag documented in
        # projects/basic/README.md's Rollback section.
        id: vars
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          BUILD_TAG=$(date -u +'%Y%m%d-%H%M%S')-${GITHUB_RUN_NUMBER}-${SHORT_SHA}
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"

      - name: Build, tag, and push image to ECR
        # Builds the image once and pushes all three tags (git SHA, human-
        # readable build tag, and latest) so they point at identical layers.
        #
        # cache-from/cache-to persist the build layers in the GitHub Actions
        # cache between runs. Because runners are ephemeral, without this every
        # run would rebuild from scratch (re-installing dependencies, etc.).
        # With it, unchanged layers are restored from cache and only the diff
        # is rebuilt.
        uses: docker/build-push-action@v6
        with:
          context: projects/basic
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ steps.vars.outputs.build_tag }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha,scope=basic
          cache-to: type=gha,mode=max,scope=basic

      - name: Record build tag in job summary
        # Writes the build tag to this run's summary page (visible in the
        # Actions tab UI) so you don't have to dig through raw logs to find
        # it later if you ever need to roll back to this exact build.
        run: |
          echo "### Deployed image tags" >> "$GITHUB_STEP_SUMMARY"
          echo "- Build tag (use this for rollback): \`${{ steps.vars.outputs.build_tag }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Git SHA tag: \`${{ env.IMAGE_TAG }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy to EC2 via SSH
        # Connects to the production host and tells Docker Compose to pull
        # the ":latest" image just pushed above and restart only the basic
        # container.
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          command_timeout: 60m
          script: |
            # The OIDC-derived AWS credentials from the earlier step only
            # exist on this GitHub Actions runner, not on the EC2 host — so
            # the EC2 host authenticates to ECR itself, using the IAM
            # instance role already attached to it (see SETUP.md
            # § 2.10 "Create IAM Role for EC2").
            aws ecr get-login-password --region ${{ env.AWS_REGION }} | \
              docker login --username AWS --password-stdin \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com

            # -f ~/docker-compose.yml : always target the one production
            #     compose file explicitly, regardless of the SSH session's
            #     working directory.
            # pull basic              : only fetch the new image for this
            #     project, not every service defined in the compose file.
            # up -d --no-deps basic   : only recreate the basic container;
            #     --no-deps stops Compose from touching any other service
            #     (e.g. langchain) defined in the same compose file, so
            #     this deploy has zero downtime for unrelated projects.
            # Light cleanup: remove only dangling (untagged) images.
            # We keep tagged images cached so that 'docker compose pull'
            # can reuse unchanged layers and only download the diff —
            # much faster than re-pulling from scratch every time.
            docker image prune -f

            docker compose -f ~/docker-compose.yml pull basic
            docker compose -f ~/docker-compose.yml up -d --no-deps basic
